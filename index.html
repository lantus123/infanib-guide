<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>INFANIB｜20 項圖解與評分（候選版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div class="header-row"><b class="brand">INFANIB</b><select id="jump" aria-label="跳至檢查項目"></select><select id="age" aria-label="矯正月齡"><option value="6">6 個月</option><option value="12">12 個月</option></select></div><div class="header-meta"><div id="bar" role="img" aria-label="評分進度"><i></i></div><button id="summary" aria-label="查看評估摘要"><span id="progress" aria-live="polite"></span></button><button id="help" aria-label="使用說明與資料來源">說明 ⓘ</button></div></header>
<main id="screen" aria-label="左右滑動切換項目"><div id="reveal" aria-hidden="true"></div><section id="item"></section></main>
<nav class="bottom" aria-label="項目導覽"><button id="prev">上一項</button><span id="page">1 / 20</span><button id="next">下一項</button></nav></div>
<dialog id="details"><div class="dialog-head"><h2 id="detail-title">操作說明</h2><button id="close-details">關閉 ✕</button></div><div id="detail-body"></div></dialog><dialog id="photo"><div class="zoom-head"><h2 id="zoom-title">原圖</h2><button id="close-photo">關閉 ✕</button></div><div class="zoom-tools"><button data-zoom="1">全圖</button><button data-zoom="1.5">1.5×</button><button data-zoom="2">2×</button><span>放大後可拖曳／捲動查看</span></div><div class="zoom-stage"><img alt=""></div><p></p></dialog><dialog id="confirm-age" aria-labelledby="confirm-age-title"><h2 id="confirm-age-title">變更月齡？</h2><p>變更月齡會清除本次所有分數。未確認前仍保留目前月齡。</p><div class="age-confirm-actions"><button id="cancel-age">取消，保留分數</button><button id="accept-age">清除分數並變更</button></div></dialog><script type="module" src="app.mjs"></script>
</body>
</html>
